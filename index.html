<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balap Kuis Trivia - 6 Pemain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #status-text {
      font-size: 0.95rem;
      color: #4facfe;
      margin-bottom: 15px;
      font-weight: 600;
    }

    /* Track Balapan Neon */
    .track-container {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 850px;
      position: relative;
      margin-bottom: 20px;
    }

    .lane {
      height: 42px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      position: relative;
      display: flex;
      align-items: center;
    }
    .lane:last-child { border-bottom: none; }

    .lane-label {
      position: absolute;
      left: 5px;
      font-size: 0.75rem;
      color: #a8a8b3;
      z-index: 1;
      font-weight: bold;
    }

    .car {
      font-size: 24px;
      position: absolute;
      left: 0%;
      transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 2;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }

    .finish-line {
      position: absolute;
      right: 15px;
      top: 0;
      bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(0deg, #fff, #fff 8px, #000 8px, #000 16px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      z-index: 1;
    }

    /* Area Kuis Glassmorphism */
    .quiz-box {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 850px;
      padding: 25px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .question {
      font-size: 1.25rem;
      margin-bottom: 20px;
      font-weight: 600;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      line-height: 1.4;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-opt {
      background: linear-gradient(135deg, #2b5876, #4e4376);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 18px;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-weight: 500;
    }

    .btn-opt:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
    }

    .btn-opt:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info-bar {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .options { grid-template-columns: 1fr; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <h1>🏁 BALAP KUIS TRIVIA 🏎️</h1>
  <p id="status-text">Memuat Soal dari Google Sheet...</p>

  <!-- Track Balap 6 Pemain -->
  <div class="track-container">
    <div class="finish-line"></div>
    <div class="lane"><span class="lane-label">P1</span><div class="car" id="car-0">🏎️ (Kamu)</div></div>
    <div class="lane"><span class="lane-label">P2</span><div class="car" id="car-1">🚗 Bot 1</div></div>
    <div class="lane"><span class="lane-label">P3</span><div class="car" id="car-2">🚙 Bot 2</div></div>
    <div class="lane"><span class="lane-label">P4</span><div class="car" id="car-3">🏎️ Bot 3</div></div>
    <div class="lane"><span class="lane-label">P5</span><div class="car" id="car-4">🛻 Bot 4</div></div>
    <div class="lane"><span class="lane-label">P6</span><div class="car" id="car-5">🏎️ Bot 5</div></div>
  </div>

  <!-- Box Kuis -->
  <div class="quiz-box">
    <div class="question" id="question-text">Menyiapkan balapan...</div>
    <div class="options" id="options-container">
      <button class="btn-opt" onclick="checkAnswer(0)">A. Pilihan 1</button>
      <button class="btn-opt" onclick="checkAnswer(1)">B. Pilihan 2</button>
      <button class="btn-opt" onclick="checkAnswer(2)">C. Pilihan 3</button>
      <button class="btn-opt" onclick="checkAnswer(3)">D. Pilihan 4</button>
    </div>
  </div>

  <div class="info-bar" id="progress-info">Soal Terjawab: 0 / 0</div>

  <script>
    let questions = [];
    let currentQuestionIndex = 0;
    
    // Posisi untuk 6 pemain [Player1, Bot1, Bot2, Bot3, Bot4, Bot5]
    let playerPositions = [0, 0, 0, 0, 0, 0];
    let moveStep = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get('id') || '1BssaGcougen7R_fsOQeGC7RDhOhbzUDcBrdymigVoME';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

    // Parser CSV Kompatibel Tanda Koma & Petik
    function parseCSV(text) {
      let p = '', c = '', r = [];
      let q = false;
      let row = [''];
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (q && next === '"') { row[row.length - 1] += '"'; i++; }
          else { q = !q; }
        } else if (c === ',' && !q) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !q) {
          if (c === '\r' && next === '\n') { i++; }
          r.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') r.push(row);
      return r;
    }

    async function loadQuestions() {
      try {
        const response = await fetch(csvUrl);
        const data = await response.text();
        const rows = parseCSV(data);
        
        questions = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (r.length >= 6 && r[0].trim() !== '') {
            questions.push({
              pertanyaan: r[0].trim(),
              a: r[1].trim(),
              b: r[2].trim(),
              c: r[3].trim(),
              d: r[4].trim(),
              jawaban: r[5].trim().toUpperCase()
            });
          }
        }

        if (questions.length === 0) throw new Error("Kosong");

        // Hitung jarak pergerakan berdasarkan jumlah soal yang berhasil diambil
        moveStep = 80 / questions.length;

        document.getElementById('status-text').innerText = `⚡ ${questions.length} Soal Berhasil Dimuat! Ready, Set, GO! 🏁`;
        displayQuestion();

      } catch (err) {
        document.getElementById('status-text').innerText = "⚠️ Gagal mengambil soal Sheet. Menggunakan Soal Cadangan.";
        useFallbackQuestions();
      }
    }

    function useFallbackQuestions() {
      questions = [
        { pertanyaan: "Berapa hasil dari 10 + 15?", a: "20", b: "25", c: "30", d: "35", jawaban: "B" },
        { pertanyaan: "Ibu kota negara Indonesia?", a: "Surabaya", b: "Medan", c: "Jakarta / IKN", d: "Bandung", jawaban: "C" },
        { pertanyaan: "Warna bendera negara Indonesia?", a: "Merah Putih", b: "Putih Merah", c: "Merah Kuning", d: "Biru Putih", jawaban: "A" }
      ];
      moveStep = 80 / questions.length;
      displayQuestion();
    }

    function displayQuestion() {
      if (currentQuestionIndex >= questions.length) {
        finishGame();
        return;
      }

      const q = questions[currentQuestionIndex];
      document.getElementById('question-text').innerText = `[Soal ${currentQuestionIndex + 1} dari ${questions.length}] ${q.pertanyaan}`;
      
      const buttons = document.querySelectorAll('.btn-opt');
      const opts = [q.a, q.b, q.c, q.d];
      const keys = ["A", "B", "C", "D"];

      buttons.forEach((btn, idx) => {
        btn.innerText = `${keys[idx]}. ${opts[idx]}`;
        btn.disabled = false;
      });

      document.getElementById('progress-info').innerText = `Progress Soal: ${currentQuestionIndex} / ${questions.length}`;
    }

    function checkAnswer(selectedIdx) {
      const keys = ["A", "B", "C", "D"];
      const selectedKey = keys[selectedIdx];
      const currentQ = questions[currentQuestionIndex];

      document.querySelectorAll('.btn-opt').forEach(btn => btn.disabled = true);

      // 1. Pergerakan Player (P1)
      if (selectedKey === currentQ.jawaban) {
        playerPositions[0] += moveStep;
      }

      // 2. Simulasi Pergerakan 5 Bot Lawan secara acak
      for (let i = 1; i <= 5; i++) {
        // Peluang bot menjawab benar (65%)
        if (Math.random() < 0.65) {
          playerPositions[i] += moveStep * (0.8 + Math.random() * 0.4); // Variasi kecepatan bot
        }
      }

      // Update Tampilan Posisi Mobil di Track
      for (let i = 0; i < 6; i++) {
        document.getElementById(`car-${i}`).style.left = `${playerPositions[i]}%`;
      }

      currentQuestionIndex++;

      // Cek Kondisi Menang / Selesai
      const hasWinner = playerPositions.some(pos => pos >= 80);
      if (hasWinner || currentQuestionIndex >= questions.length) {
        setTimeout(finishGame, 700);
      } else {
        setTimeout(displayQuestion, 700);
      }
    }

    function finishGame() {
      // Hitung Peringkat Akhir
      let leaderboard = playerPositions.map((pos, idx) => {
        return { name: idx === 0 ? "Kamu (Player 1)" : `Bot ${idx}`, score: pos };
      });
      
      leaderboard.sort((a, b) => b.score - a.score);

      const userRank = leaderboard.findIndex(p => p.name === "Kamu (Player 1)") + 1;
      let statusMsg = userRank === 1 ? "🏆 SELAMAT! KAMU MENANG BALAPAN! 🎉" : `🏁 Balapan Selesai! Kamu Finish di Posisi #${userRank}`;

      document.getElementById('question-text').innerHTML = `<span style="color: #00f2fe">${statusMsg}</span>`;
      document.getElementById('options-container').innerHTML = `
        <button class="btn-opt" style="grid-column: span 2; text-align: center; font-size: 1.1rem;" onclick="location.reload()">🔄 Main Lagi</button>
      `;
    }

    loadQuestions();
  </script>
</body>
</html>
