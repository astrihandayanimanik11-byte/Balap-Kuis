<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balap Kuis Trivia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #2e1c3b, #4a2e5d, #6b4c82);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    .game-screen {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
      color: #e9d5ff;
      text-shadow: 0 0 10px rgba(233, 213, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }

    #status-text {
      font-size: 0.95rem;
      color: #d8b4fe;
      margin-bottom: 15px;
      font-weight: 600;
      text-align: center;
    }

    /* Track Balap */
    .track-container {
      background: rgba(30, 15, 45, 0.9);
      border: 2px solid #c084fc;
      box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
      border-radius: 16px;
      padding: 15px;
      width: 100%;
      position: relative;
      margin-bottom: 20px;
    }

    .lane {
      height: 42px;
      border-bottom: 1px dashed rgba(216, 180, 254, 0.2);
      position: relative;
      display: flex;
      align-items: center;
    }
    .lane:last-child { border-bottom: none; }

    .lane-label {
      position: absolute;
      left: 5px;
      font-size: 0.75rem;
      color: #d8b4fe;
      z-index: 1;
      font-weight: bold;
    }

    .car {
      font-size: 24px;
      position: absolute;
      left: 0%;
      transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 2;
      filter: drop-shadow(0 0 5px rgba(233, 213, 255, 0.6));
    }

    .finish-line {
      position: absolute;
      right: 15px;
      top: 0;
      bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(0deg, #fff, #fff 8px, #3b0764 8px, #3b0764 16px);
      box-shadow: 0 0 10px rgba(216, 180, 254, 0.8);
      z-index: 1;
    }

    /* Box Kuis & Menu */
    .quiz-box {
      background: rgba(45, 27, 61, 0.9);
      border: 1px solid rgba(216, 180, 254, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .question {
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: 600;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      line-height: 1.4;
      text-align: center;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-opt {
      background: linear-gradient(135deg, #582a72, #3b1852);
      color: #f3e8ff;
      border: 1px solid rgba(216, 180, 254, 0.3);
      padding: 14px 18px;
      font-size: 0.95rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-weight: 500;
    }

    .btn-opt:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
      color: #ffffff;
    }

    .btn-opt:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Styling Menu Input */
    .start-menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
    }

    .input-sheet {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #c084fc;
      background: rgba(20, 10, 30, 0.8);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      text-align: center;
    }

    .input-sheet::placeholder {
      color: #a855f7;
    }

    .btn-play {
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #fff;
      border: none;
      padding: 16px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-play:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #c084fc, #9333ea);
    }

    .info-bar {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #d8b4fe;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 600px) {
      .options { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="game-screen">
    <h1>🏁 BALAP KUIS TRIVIA 🏎️</h1>
    <p id="status-text">Masukkan Link Spreadsheet untuk memulai balapan!</p>

    <!-- Track Balap 6 Pemain -->
    <div class="track-container">
      <div class="finish-line"></div>
      <div class="lane"><span class="lane-label">P1</span><div class="car" id="car-0">🏎️ Player 1 (Kamu)</div></div>
      <div class="lane"><span class="lane-label">P2</span><div class="car" id="car-1">🚗 Player 2</div></div>
      <div class="lane"><span class="lane-label">P3</span><div class="car" id="car-2">🚙 Player 3</div></div>
      <div class="lane"><span class="lane-label">P4</span><div class="car" id="car-3">🏎️ Player 4</div></div>
      <div class="lane"><span class="lane-label">P5</span><div class="car" id="car-5">🛻 Player 5</div></div>
      <div class="lane"><span class="lane-label">P6</span><div class="car" id="car-5">🏎️ Player 6</div></div>
    </div>

    <!-- Box Kuis & Menu Utama -->
    <div class="quiz-box">
      <div id="game-content">
        <div class="start-menu">
          <input type="text" id="sheet-url-input" class="input-sheet" placeholder="Tempel Link Google Spreadsheet di sini..." />
          <button class="btn-play" onclick="startRace()">🚀 AYO BERMAIN 🚀</button>
        </div>
      </div>
    </div>

    <div class="info-bar" id="progress-info">Siap Bertanding!</div>
  </div>

  <script>
    let questions = [];
    let currentQuestionIndex = 0;
    let playerPositions = [0, 0, 0, 0, 0, 0];
    let moveStep = 0;

    // Ekstrak ID Spreadsheet dari string input atau URL
    function extractSheetId(inputStr) {
      if (!inputStr) return null;
      const match = inputStr.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : inputStr.trim();
    }

    function parseCSV(text) {
      let p = '', c = '', r = [];
      let q = false;
      let row = [''];
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (q && next === '"') { row[row.length - 1] += '"'; i++; }
          else { q = !q; }
        } else if (c === ',' && !q) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !q) {
          if (c === '\r' && next === '\n') { i++; }
          r.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') r.push(row);
      return r;
    }

    async function startRace() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('id') || urlParams.get('sheet');
      const inputVal = document.getElementById('sheet-url-input') ? document.getElementById('sheet-url-input').value : '';
      
      const sheetId = extractSheetId(inputVal) || extractSheetId(urlId);

      if (!sheetId) {
        alert("Silakan masukkan link Google Spreadsheet terlebih dahulu!");
        return;
      }

      document.getElementById('status-text').innerText = "Memuat Soal dari Spreadsheet...";

      const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error("Gagal mengambil data");

        const data = await response.text();
        const rows = parseCSV(data);
        
        questions = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (r.length >= 6 && r[0].trim() !== '') {
            questions.push({
              pertanyaan: r[0].trim(),
              a: r[1].trim(),
              b: r[2].trim(),
              c: r[3].trim(),
              d: r[4].trim(),
              jawaban: r[5].trim().toUpperCase()
            });
          }
        }

        if (questions.length === 0) throw new Error("Spreadsheet Kosong");

        moveStep = 80 / questions.length;
        document.getElementById('status-text').innerText = `⚡ Memuat ${questions.length} Soal! Selamat Balapan!`;
        
        setupQuizUI();
        displayQuestion();

      } catch (err) {
        document.getElementById('status-text').innerText = "⚠️ Gagal membaca Spreadsheet. Pastikan akses Spreadsheet diubah ke 'Siapa saja yang memiliki link'.";
      }
    }

    function setupQuizUI() {
      document.getElementById('game-content').innerHTML = `
        <div class="question" id="question-text">Menyiapkan balapan...</div>
        <div class="options" id="options-container">
          <button class="btn-opt" onclick="checkAnswer(0)">A. Pilihan 1</button>
          <button class="btn-opt" onclick="checkAnswer(1)">B. Pilihan 2</button>
          <button class="btn-opt" onclick="checkAnswer(2)">C. Pilihan 3</button>
          <button class="btn-opt" onclick="checkAnswer(3)">D. Pilihan 4</button>
        </div>
      `;
    }

    function displayQuestion() {
      if (currentQuestionIndex >= questions.length) {
        finishGame();
        return;
      }

      const q = questions[currentQuestionIndex];
      document.getElementById('question-text').innerText = `[Soal ${currentQuestionIndex + 1} dari ${questions.length}] ${q.pertanyaan}`;
      
      const buttons = document.querySelectorAll('.btn-opt');
      const opts = [q.a, q.b, q.c, q.d];
      const keys = ["A", "B", "C", "D"];

      buttons.forEach((btn, idx) => {
        btn.innerText = `${keys[idx]}. ${opts[idx]}`;
        btn.disabled = false;
      });

      document.getElementById('progress-info').innerText = `Progress Soal: ${currentQuestionIndex} / ${questions.length}`;
    }

    function checkAnswer(selectedIdx) {
      const keys = ["A", "B", "C", "D"];
      const selectedKey = keys[selectedIdx];
      const currentQ = questions[currentQuestionIndex];

      document.querySelectorAll('.btn-opt').forEach(btn => btn.disabled = true);

      if (selectedKey === currentQ.jawaban) {
        playerPositions[0] += moveStep;
      }

      for (let i = 1; i <= 5; i++) {
        if (Math.random() < 0.65) {
          playerPositions[i] += moveStep * (0.8 + Math.random() * 0.4);
        }
      }

      for (let i = 0; i < 6; i++) {
        document.getElementById(`car-${i}`).style.left = `${playerPositions[i]}%`;
      }

      currentQuestionIndex++;

      const hasWinner = playerPositions.some(pos => pos >= 80);
      if (hasWinner || currentQuestionIndex >= questions.length) {
        setTimeout(finishGame, 700);
      } else {
        setTimeout(displayQuestion, 700);
      }
    }

    function finishGame() {
      let leaderboard = playerPositions.map((pos, idx) => {
        return { name: `Player ${idx + 1}${idx === 0 ? " (Kamu)" : ""}`, score: pos };
      });
      
      leaderboard.sort((a, b) => b.score - a.score);

      const userRank = leaderboard.findIndex(p => p.name.includes("Kamu")) + 1;
      let statusMsg = userRank === 1 ? "🏆 SELAMAT! KAMU MENANG BALAPAN! 🎉" : `🏁 Balapan Selesai! Kamu Finish di Posisi #${userRank}`;

      document.getElementById('question-text').innerHTML = `<span style="color: #e9d5ff">${statusMsg}</span>`;
      document.getElementById('options-container').innerHTML = `
        <button class="btn-opt" style="grid-column: span 2; text-align: center; font-size: 1.1rem;" onclick="location.reload()">🔄 Main Lagi</button>
      `;
    }

    // Otomatis jalankan jika ID disertakan pada URL (?id=...)
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('id') || urlParams.has('sheet')) {
        startRace();
      }
    };
  </script>
</body>
</html>
